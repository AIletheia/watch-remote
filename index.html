<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Task Remote</title>
  <script src="https://www.puck-js.com/puck.js"></script>
  <style>
    body { font-family: sans-serif; background: #111; color: white; padding: 0; margin: 0; text-align: center; }
    #banner { padding: 15px; font-weight: bold; font-size: 18px; transition: background 0.3s; }
    .disconnected { background: #dc3545; }
    .connected { background: #28a745; }
    .container { padding: 20px; }
    
    /* Layouts */
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
    .hidden { display: none !important; }
    
    /* Buttons */
    button { padding: 20px; border-radius: 10px; border: none; font-size: 16px; font-weight: bold; color: white; transition: opacity 0.2s; }
    button:disabled { opacity: 0.3; pointer-events: none; }
    .preset { background: #333; }
    .green { background: #28a745; width: 100%; margin-bottom: 15px;}
    .red { background: #dc3545; width: 100%; margin-bottom: 15px;}
    .blue { background: #007bff; width: 100%; margin-bottom: 15px;}
    .gold { background: #ffc107; color: black; width: 100%; margin-bottom: 15px;}
    
    /* Task Screen specifics */
    #liveTimer { font-size: 60px; font-weight: bold; margin: 20px 0; font-family: monospace;}
    #liveTaskName { font-size: 24px; color: #aaa; }
    h2 { border-bottom: 1px solid #444; padding-bottom: 10px; margin-top: 20px;}
  </style>
</head>
<body>

  <div id="banner" class="disconnected">Status: Disconnected</div>

  <div class="container">
    <div class="grid">
      <button id="btnConnect" class="blue" onclick="connectWatch()" style="margin:0;">Connect</button>
      <button id="btnDisconnect" class="blue" onclick="disconnectWatch()" style="margin:0;" disabled>Disconnect</button>
    </div>

    <div id="view-dashboard">
      <h2>Quick Launch</h2>
      <div class="grid">
        <button class="preset task-btn" onclick="sendCmd('cmdStartTask(\'Routine\', 15, 2)')" disabled>Morning Routine<br>15m | 2★</button>
        <button class="preset task-btn" onclick="sendCmd('cmdStartTask(\'Homework\', 30, 3)')" disabled>Homework<br>30m | 3★</button>
        <button class="preset task-btn" onclick="sendCmd('cmdStartTask(\'Clean\', 10, 1)')" disabled>Tidy Room<br>10m | 1★</button>
        <button class="preset task-btn" onclick="sendCmd('cmdStartTask(\'Bonus\', 2, 1)')" disabled>Earn-Back<br>2m | 1★</button>
      </div>

      <h2 id="assessmentHeader">Assessment & Instant</h2>
      <div class="grid">
        <button class="green task-btn" onclick="sendCmd('cmdAssess(true, false)')" disabled>Verify: PASS</button>
        <button class="red task-btn" onclick="sendCmd('cmdAssess(false, false)')" disabled>Verify: FAIL</button>
      </div>
      <button class="green task-btn" onclick="sendCmd('cmdInstantStar(1)')" disabled>+1 Instant Star</button>
      <button class="red task-btn" onclick="sendCmd('cmdInstantStar(-1)')" disabled>-1 Instant Star</button>
    </div>

    <div id="view-task" class="hidden">
      <h2 style="color: #00ff00;">Task Active</h2>
      <div id="liveTaskName">Loading...</div>
      <div id="liveTimer">00:00</div>
      
      <button class="green" onclick="sendCmd('cmdAssess(true, false)')">Early Finish<br>(Claim Base Reward)</button>
      <button class="gold" onclick="sendCmd('cmdAssess(true, true)')">Early Finish + BONUS<br>(Claim Base + 1★)</button>
      <button class="red" onclick="sendCmd('cmdAssess(false, false)')" style="margin-top: 20px;">Abort Task / Fail</button>
    </div>

  </div>

  <script>
    let connection = null;
    let lineBuffer = "";

    function updateUI(isConnected) {
      let banner = document.getElementById('banner');
      banner.className = isConnected ? "connected" : "disconnected";
      banner.innerText = isConnected ? "Status: Connected" : "Status: Disconnected";
      
      document.getElementById('btnConnect').disabled = isConnected;
      document.getElementById('btnDisconnect').disabled = !isConnected;

      let taskButtons = document.querySelectorAll('.task-btn');
      taskButtons.forEach(btn => btn.disabled = !isConnected);
      
      // Reset view if disconnected
      if (!isConnected) {
        document.getElementById('view-dashboard').classList.remove('hidden');
        document.getElementById('view-task').classList.add('hidden');
      }
    }

    // Process incoming JSON from the watch
    function handleTelemetry(data) {
      let dashView = document.getElementById('view-dashboard');
      let taskView = document.getElementById('view-task');

      if (data.state === "TASK") {
        // Show Active Task View
        dashView.classList.add('hidden');
        taskView.classList.remove('hidden');
        
        document.getElementById('liveTaskName').innerText = data.taskName + " (Reward: " + data.potentialReward + "★)";
        
        let m = Math.floor(data.timeRemaining / 60);
        let s = data.timeRemaining % 60;
        document.getElementById('liveTimer').innerText = m + ":" + ("0"+s).substr(-2);
      } 
      else if (data.state === "STANDBY" || data.state === "PENDING") {
        // Show Dashboard View
        taskView.classList.add('hidden');
        dashView.classList.remove('hidden');
        
        if(data.state === "PENDING") {
          document.getElementById('assessmentHeader').innerText = "PENDING ASSESSMENT!";
          document.getElementById('assessmentHeader').style.color = "#ffff00";
        } else {
          document.getElementById('assessmentHeader').innerText = "Assessment & Instant";
          document.getElementById('assessmentHeader').style.color = "white";
        }
      }
    }

    function connectWatch() {
      Puck.connect(function(c) {
        if (!c) {
          alert("Couldn't connect. Ensure watch is unlocked and disconnected from PC.");
          return;
        }
        connection = c;
        updateUI(true);
        
        // Listen for live data from the watch
        connection.on("data", function(d) {
          lineBuffer += d;
          let lines = lineBuffer.split("\n");
          lineBuffer = lines.pop(); // keep incomplete line
          
          lines.forEach(line => {
            if (line.startsWith("{")) {
              try {
                let msg = JSON.parse(line);
                handleTelemetry(msg);
              } catch(e) { console.log("JSON Parse Error", e); }
            }
          });
        });

        connection.on("close", function() {
          connection = null;
          updateUI(false);
        });
      });
    }

    function disconnectWatch() {
      if (connection) {
        connection.close();
      }
    }

    function sendCmd(cmd) {
      if (!connection) return;
      connection.write(cmd + ";\n");
    }
  </script>
</body>
</html>
