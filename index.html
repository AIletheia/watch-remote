<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Task Remote</title>
  <!-- Load Espruino's Web Bluetooth Library -->
  <script src="https://www.puck-js.com/puck.js"></script>
  <style>
    body { font-family: sans-serif; background: #111; color: white; padding: 20px; text-align: center; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 30px; }
    button { padding: 20px; border-radius: 10px; border: none; font-size: 16px; font-weight: bold; color: white; }
    .preset { background: #333; }
    .green { background: #28a745; width: 100%; margin-bottom: 15px;}
    .red { background: #dc3545; width: 100%; margin-bottom: 15px;}
    .blue { background: #007bff; width: 100%; margin-bottom: 15px;}
    h2 { border-bottom: 1px solid #444; padding-bottom: 10px; }
  </style>
</head>
<body>

  <h2>Quick Launch (Zone 1)</h2>
  <div class="grid">
    <button class="preset" onclick="sendCmd('cmdStartTask(\'Routine\', 15, 2)')">Morning Routine<br>15m | 2★</button>
    <button class="preset" onclick="sendCmd('cmdStartTask(\'Homework\', 30, 3)')">Homework<br>30m | 3★</button>
    <button class="preset" onclick="sendCmd('cmdStartTask(\'Clean\', 10, 1)')">Tidy Room<br>10m | 1★</button>
    <button class="preset" onclick="sendCmd('cmdStartTask(\'Bonus\', 2, 1)')">Earn-Back<br>2m | 1★</button>
  </div>

  <h2>Assessment & Instant (Zone 2)</h2>
  <div class="grid">
    <button class="green" onclick="sendCmd('cmdAssess(true)')">Verify: PASS</button>
    <button class="red" onclick="sendCmd('cmdAssess(false)')">Verify: FAIL</button>
  </div>
  <button class="green" onclick="sendCmd('cmdInstantStar(1)')">+1 Instant Star</button>
  <button class="red" onclick="sendCmd('cmdInstantStar(-1)')">-1 Instant Star</button>

  <script>
    // Send a command to the Bangle.js over Web Bluetooth
    function sendCmd(cmd) {
      // Puck.write automatically handles connection and disconnection
      Puck.write(cmd + ";\n", function(result) {
        if (result === null) {
          alert("Connection failed. Ensure Bangle is nearby and unlocked.");
        }
      });
    }
  </script>

</body>
</html>
